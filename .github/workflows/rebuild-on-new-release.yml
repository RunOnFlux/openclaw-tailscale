name: Rebuild on new stable OpenClaw release

# Pin to upstream's STABLE releases (YYYY.M.D tags) and follow them
# automatically. Upstream's :latest tag is an alias of :main — a rolling build
# of their main branch (unreleased code) — so tracking it rebuilt this image
# whenever main advanced and restarted every Flux deployment onto unreleased
# builds. Instead, this workflow detects the newest stable version tag on GHCR,
# compares it to the version baked into our published image, and only rebuilds
# when a genuinely new release appears. The detected version is passed to the
# build as OPENCLAW_VERSION.

on:
  schedule:
    # Daily check — cheap; it only builds when a NEW stable tag is published.
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    # Only changes that alter the image rebuild it. A README or workflow edit
    # would otherwise publish an identical build under a new digest, and every
    # deployed app would be soft-redeployed for nothing.
    paths:
      - 'Dockerfile'
      - 'start.sh'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Base version tag to build (e.g. 2026.5.22). Blank = auto-detect newest stable.'
        required: false
        default: ''

env:
  IMAGE_NAME: runonflux/openclaw-tailscale
  BASE_REPO: openclaw/openclaw          # GHCR repository (ghcr.io/<BASE_REPO>)
  # Optional ceiling for the scheduled job, e.g. '2026.9.5'. Empty = follow the
  # newest stable release. Use it to hold a release back when an upstream
  # version needs a one-off migration step before the fleet may move on.
  MAX_VERSION: ''

permissions:
  contents: read
  actions: write   # keepalive step below

# One run at a time: a push and the daily schedule must not publish in parallel.
concurrency:
  group: rebuild-image
  cancel-in-progress: false

jobs:
  check-and-rebuild:
    # Publishing :latest is only ever done from main, so a dispatch from another
    # branch cannot overwrite what every deployed app follows.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve newest stable upstream version
        id: latest
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          OVERRIDE="$FORCE_VERSION"
          if [ -n "$OVERRIDE" ] && ! echo "$OVERRIDE" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::force_version must look like 2026.11.1"
            exit 1
          fi
          if [ -n "$OVERRIDE" ]; then
            LATEST="$OVERRIDE"
            echo "Using forced version: $LATEST"
          else
            # Stable releases are YYYY.M.D[-N] tags (N = same-day hotfix). The
            # :latest / :main rolling builds, the -slim variants, and -alpha /
            # -beta / -rc pre-releases are all deliberately excluded. List tags
            # from GHCR (anonymous pull token), keep the stable ones, pick the
            # highest by semver order (sort -V).
            # GHCR lists tags in its own order (not version order) and caps every page at 1000
            # entries, whatever ?n= asks for (the repo has 2000+ tags), and
            # points at the next page in a Link header. Without following it,
            # only the oldest 1000 tags were seen and the newest "stable" one
            # was stuck at 2026.5.22 for months. Follow Link until it ends.
            TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${BASE_REPO}:pull" | jq -r '.token')
            URL="https://ghcr.io/v2/${BASE_REPO}/tags/list?n=1000"
            ALL=""
            while [ -n "$URL" ]; do
              curl -fsSL -D "$RUNNER_TEMP/headers.txt" -o "$RUNNER_TEMP/page.json" -H "Authorization: Bearer $TOKEN" "$URL"
              ALL="$ALL"$'\n'"$(jq -r ".tags[]?" "$RUNNER_TEMP/page.json")"
              NEXT=$( { grep -i "^link:" "$RUNNER_TEMP/headers.txt" || true; } | sed -n 's/.*<\([^>]*\)>.*/\1/p' | tr -d '\r')
              if [ -n "$NEXT" ]; then URL="https://ghcr.io${NEXT}"; else URL=""; fi
            done
            STABLE=$(echo "$ALL" \
              | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$' \
              | sort -V)
            if [ -n "$MAX_VERSION" ]; then
              # Keep releases not newer than the ceiling, by version order, so a
              # ceiling that is not itself a published tag still works.
              CAPPED=""
              for V in $STABLE; do
                if [ "$(printf '%s\n%s\n' "$V" "$MAX_VERSION" | sort -V | tail -1)" = "$MAX_VERSION" ]; then
                  CAPPED="$CAPPED$V"$'\n'
                fi
              done
              STABLE="$CAPPED"
            fi
            LATEST=$(echo "$STABLE" | sed '/^$/d' | tail -1)
          fi
          if [ -z "$LATEST" ]; then
            echo "::error::Could not resolve a stable YYYY.M.D tag for ${BASE_REPO}"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Newest stable upstream version: $LATEST"

      - name: Read version baked into our published image
        id: current
        run: |
          # Read the base version label back from our PUBLISHED image in the
          # registry (not `docker inspect`, which only sees locally-pulled images
          # — a fresh runner has none, so it would always look empty and force a
          # rebuild). Empty on the first run after this migration -> one rebuild.
          # A registry or network failure must fail the job (set -e): only a
          # successful read with no label counts as "never built by this workflow".
          CURRENT=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.base.version" }}')
          if [ "$CURRENT" = "<no value>" ]; then CURRENT=""; fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently published base version: ${CURRENT:-<none>}"

      - name: Decide whether to rebuild
        id: decide
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          CURRENT: ${{ steps.current.outputs.version }}
          EVENT: ${{ github.event_name }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          if [ -n "$FORCE_VERSION" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Forced version $FORCE_VERSION -> rebuild (even if older than '$CURRENT')"
          elif [ -z "$CURRENT" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Published image has no version label -> rebuild on $LATEST"
          elif newer "$LATEST" "$CURRENT"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New stable release $LATEST (published image is on $CURRENT) -> rebuild"
          elif [ "$LATEST" = "$CURRENT" ] && [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Same release $LATEST, triggered by $EVENT (image files changed or manual run) -> rebuild"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: newest allowed release is $LATEST, published image is on $CURRENT"
          fi

      - name: Checkout
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ steps.latest.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.latest.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.base.name=ghcr.io/${{ env.BASE_REPO }}:${{ steps.latest.outputs.version }}
            org.opencontainers.image.base.version=${{ steps.latest.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and a successful build creates no commit. This call counts as
      # activity, so the daily check keeps running between upstream releases.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/rebuild-on-new-release.yml/enable" \
            || echo "::warning::could not refresh the workflow schedule"
