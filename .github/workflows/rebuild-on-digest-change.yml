name: Rebuild on OpenClaw digest change

on:
  schedule:
    # Check once per day for a new OpenClaw image
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/openclaw-tailscale
  BASE_IMAGE: ghcr.io/openclaw/openclaw:latest

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check current base image digest
        id: check
        run: |
          # Top-level manifest-list (index) digest of the base image. This
          # changes whenever ANY platform or attestation changes upstream.
          NEW_DIGEST=$(docker buildx imagetools inspect "$BASE_IMAGE" \
            --format '{{ json .Manifest }}' 2>/dev/null | jq -r '.digest // empty')
          if [ -z "$NEW_DIGEST" ]; then
            echo "::error::Could not resolve base image digest for $BASE_IMAGE"
            exit 1
          fi
          echo "new_digest=$NEW_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current upstream digest: $NEW_DIGEST"

      - name: Get stored digest
        id: stored
        run: |
          # Read the base-image digest label back from our PUBLISHED image in
          # the registry. Must read from the registry (not `docker inspect`,
          # which only sees images already pulled to this runner — there are
          # none on a fresh runner, so it always returned empty and forced a
          # rebuild every run).
          STORED_DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:latest" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.base.digest" }}' 2>/dev/null || echo "")
          echo "old_digest=$STORED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Stored digest: $STORED_DIGEST"

      - name: Compare digests
        id: compare
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled trigger (${{ github.event_name }}), always rebuild"
          elif [ "${{ steps.check.outputs.new_digest }}" != "${{ steps.stored.outputs.old_digest }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Digest changed, rebuild needed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Digest unchanged, skipping rebuild"
          fi

      - name: Checkout
        if: steps.compare.outputs.changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.check.outputs.new_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
